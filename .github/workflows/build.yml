name: Build Android Release APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Test catalogue parser
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build phone and tablet model catalogue for offline use
        run: python3 scripts/build_catalog.py --ref develop

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2.15.0
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      # Android platform scaffolding is generated by Flutter so the source ZIP stays lean.
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.coverstock --project-name cover_stock --no-pub .

      - name: Set Android app label
        run: sed -i 's/android:label="cover_stock"/android:label="Cover Stock"/' android/app/src/main/AndroidManifest.xml

      - name: Install packages
        run: flutter pub get

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cover-stock-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cover-stock-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 30
